<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Resume | Abhilash Bhairi</title>
    
    <!-- Modern Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Base & Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Matches the dark theme of the main portfolio */
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        /* --- Minimal Layout Container --- */
        .resume-container {
            max-width: 600px;
            animation: fadeIn 0.8s ease-out backwards;
        }

        /* --- Typography --- */
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        h1 span {
            /* Gradient text for emphasis */
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        /* --- Premium Download Button --- */
        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25);
            position: relative;
            overflow: hidden;
        }

        .download-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Subtle shine effect on the button */
        .download-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(35deg);
            transition: all 0.5s ease;
        }

        .download-btn:hover::after {
            left: 120%;
        }

        .download-btn i {
            font-size: 1.2rem;
        }

        /* --- Back to Main Site Link --- */
        .back-link {
            display: inline-block;
            margin-top: 3rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #38bdf8;
        }

        /* --- Animation --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Mobile Adjustments --- */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            p {
                font-size: 1rem;
            }
            .download-btn {
                width: 100%;
                justify-content: center;
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="resume-container">
        <div class="badge">For Recruiters</div>
        
        <h1>My <span>Resume</span></h1>
        
        <p>Thank you for your interest! Click the button below to download my most up-to-date Computer Science and Engineering resume as a PDF.</p>
        
        <!-- IMPORTANT: Change "your-resume.pdf" to your actual file name -->
        <a href="https://abhilashbhairi.github.io/resume/Bhairi_Abhilash_Modern_Resume.pdf" class="download-btn" download="Your_Name_Resume.pdf">
            <i class="fas fa-file-download"></i>
            Download Resume
        </a>

        <br>
        
        <!-- Link back to your main portfolio -->
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
        </a>
    </div>

</body>
</html>
